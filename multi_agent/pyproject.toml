[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "travel-rewards-multi-agent"
version = "0.1.0"
description = "Local multi-agent capstone workflow for synthetic travel rewards data"
requires-python = ">=3.12,<3.14"
dependencies = [
  "crewai[litellm]==1.15.36",
  "crewai-tools[mcp]==1.15.36",
  "langgraph==1.2.20",
  "pydantic>=2.11.9,<2.13",
]

[project.scripts]
travel-rewards-agent = "travel_rewards_multi_agent.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
